<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPR Quiz — NPTEL</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e2230;
    --border: #2a2f3f;
    --accent: #4f8ef7;
    --accent2: #7c5cbf;
    --green: #3ecf8e;
    --red: #f75f5f;
    --yellow: #f7c948;
    --text: #e8eaf0;
    --muted: #7a8099;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(79,142,247,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 35% at 80% 80%, rgba(124,92,191,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Watermark ── */
  body::after {
    content: 'OKTIC';
    position: fixed;
    bottom: 28px;
    right: 32px;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(79,142,247,0.18);
    pointer-events: none;
    z-index: 9999;
    user-select: none;
  }

  .wrap { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 60px 20px 60px; }

  /* ── Header ── */
  header { padding: 36px 0 28px; display: flex; flex-direction: column; gap: 6px; }
  .tag {
    font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: var(--accent); opacity: 0.85;
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 800; line-height: 1.15;
  }
  .subtitle { font-size: 14px; color: var(--muted); margin-top: 4px; }

  /* ── Progress bar ── */
  .progress-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .progress-bar-bg { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px; transition: width 0.4s ease;
  }
  .progress-label { font-size: 13px; color: var(--muted); white-space: nowrap; }

  /* ── Question card ── */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 28px 24px;
    margin-bottom: 18px;
    transition: border-color 0.2s;
    animation: fadeUp 0.35s ease both;
  }
  .q-card:hover { border-color: #3a3f54; }

  .q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .q-num {
    font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase;
  }
  .q-badge {
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; padding: 3px 8px; border-radius: 99px;
  }
  .badge-mcq { background: rgba(79,142,247,0.15); color: var(--accent); }
  .badge-msq { background: rgba(124,92,191,0.15); color: #a07de0; }

  .q-text { font-size: 16px; line-height: 1.6; font-weight: 400; margin-bottom: 18px; color: var(--text); }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 10px; padding: 13px 16px;
    cursor: pointer; transition: all 0.18s; user-select: none;
  }
  .option:hover { border-color: var(--accent); background: rgba(79,142,247,0.06); }
  .option.selected { border-color: var(--accent); background: rgba(79,142,247,0.12); }
  .option.correct  { border-color: var(--green) !important; background: rgba(62,207,142,0.10) !important; }
  .option.wrong    { border-color: var(--red)   !important; background: rgba(247,95,95,0.10)  !important; }
  .option.missed   { border-color: var(--yellow)!important; background: rgba(247,201,72,0.10) !important; }

  .opt-bullet {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--muted);
    transition: all 0.18s;
  }
  .option.selected .opt-bullet,
  .option.correct  .opt-bullet { border-color: var(--accent); background: var(--accent); color: #fff; }
  .option.wrong    .opt-bullet { border-color: var(--red);    background: var(--red);    color: #fff; }
  .option.missed   .opt-bullet { border-color: var(--yellow); background: var(--yellow); color: #111; }

  .opt-text { font-size: 14.5px; line-height: 1.5; }
  .msq-hint { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

  /* ── Section header ── */
  .section-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 24px; padding: 18px 22px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .section-badge {
    font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; padding: 5px 12px;
    border-radius: 99px; white-space: nowrap;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
  }
  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: 16px; font-weight: 700; color: var(--text);
  }
  .section-count { font-size: 13px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  /* ── Section nav ── */
  .section-nav {
    display: flex; gap: 10px; justify-content: space-between;
    align-items: center; margin-top: 28px; padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .btn-nav {
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    background: var(--surface2); border: 1.5px solid var(--border);
    color: var(--text); border-radius: 8px;
    padding: 10px 22px; cursor: pointer; transition: all 0.18s;
  }
  .btn-nav:hover { border-color: var(--accent); color: var(--accent); }
  .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-nav-next {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent; color: #fff;
    box-shadow: 0 4px 16px rgba(79,142,247,0.28);
  }
  .btn-nav-next:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(79,142,247,0.42); border-color: transparent; color: #fff; }

  /* ── Section dots ── */
  .section-dots { display: flex; gap: 6px; align-items: center; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); transition: all 0.2s; cursor: pointer;
  }
  .dot.active { background: var(--accent); transform: scale(1.3); }
  .dot.done { background: var(--green); }

  /* ── Top bar section info ── */
  .top-bar-section {
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 700; color: var(--muted);
    letter-spacing: 1px; margin-right: auto; padding-left: 4px;
  }

  /* ── Warning bar ── */
  .warn-bar {
    background: rgba(247,201,72,0.12); border: 1px solid rgba(247,201,72,0.3);
    border-radius: 10px; padding: 12px 18px;
    font-size: 13.5px; color: var(--yellow);
    margin-bottom: 20px; display: none;
  }

  /* ── Fixed top bar ── */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; justify-content: flex-end; align-items: center;
    padding: 12px 24px;
    background: rgba(13,15,20,0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .top-bar .btn-submit {
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 8px;
    padding: 10px 28px; cursor: pointer;
    box-shadow: 0 4px 18px rgba(79,142,247,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .top-bar .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 26px rgba(79,142,247,0.45); }
  .top-bar .btn-submit:active { transform: translateY(0); }

  /* ── Submit (bottom) ── */
  .submit-wrap { display: none; }

  /* ── Result screen ── */
  #result-screen { display: none; }

  .result-hero {
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 20px 36px; text-align: center;
  }

  .circle-wrap { position: relative; width: 180px; height: 180px; margin-bottom: 28px; }
  .circle-svg { transform: rotate(-90deg); }
  .circle-bg  { fill: none; stroke: var(--surface2); stroke-width: 14; }
  .circle-fill {
    fill: none; stroke-width: 14; stroke-linecap: round;
    stroke-dasharray: 502; stroke-dashoffset: 502;
    transition: stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1);
  }
  .circle-label {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .pct-num { font-family: 'Syne', sans-serif; font-size: 40px; font-weight: 800; line-height: 1; }
  .pct-sym { font-size: 18px; font-weight: 600; color: var(--muted); }

  .result-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .result-sub { font-size: 15px; color: var(--muted); margin-bottom: 30px; }

  .stats-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
  .stat-chip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 22px; text-align: center; min-width: 100px;
  }
  .stat-val { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 16px;
  }

  .review-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .review-q { font-size: 15px; line-height: 1.6; margin-bottom: 14px; color: var(--text); }
  .review-opts { display: flex; flex-direction: column; gap: 8px; }

  .btn-retry {
    font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    background: transparent; border: 2px solid var(--accent); color: var(--accent);
    border-radius: 10px; padding: 14px 40px; cursor: pointer;
    transition: all 0.18s; margin-top: 36px;
  }
  .btn-retry:hover { background: var(--accent); color: #fff; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 540px) {
    .q-card { padding: 20px 16px; }
    .btn-submit { padding: 14px 36px; }
    .stats-row { gap: 10px; }
    .stat-chip { padding: 12px 16px; min-width: 80px; }
  }
  /* ── Easter egg toast ── */
  .nahi-toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; letter-spacing: 1px;
    padding: 14px 28px; border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 9999; white-space: nowrap;
  }
  .nahi-toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="top-bar" id="top-bar">
  <span class="top-bar-section" id="top-bar-section">Section 1 · 15 Questions</span>
  <button class="btn-submit" id="btn-submit-main"
    onmousedown="startHold()" onmouseup="cancelHold()" onmouseleave="cancelHold()"
    ontouchstart="startHold()" ontouchend="cancelHold()"
    onclick="submitQuiz()">Submit Test</button>
</div>
<div class="nahi-toast" id="nahi-toast">😭 NAHI HO RHA KYA</div>
<div class="wrap">

  <!-- ── Quiz screen ── -->
  <div id="quiz-screen">
    <header>
      <span class="tag">NPTEL · IIT Kharagpur</span>
      <h1>Intellectual Property Rights</h1>
      <p class="subtitle">Introduction to IP for Engineers &amp; Technologists · All Assignments (Weeks 1–8)</p>
    </header>

    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
      <span class="progress-label" id="prog-label">0 / 0 answered</span>
    </div>

    <div class="warn-bar" id="warn-bar"></div>
    <div id="questions-container"></div>

    <div class="submit-wrap">
      <button class="btn-submit" onclick="submitQuiz()">Submit Test</button>
    </div>
  </div>

  <!-- ── Result screen ── -->
  <div id="result-screen">
    <header>
      <span class="tag">NPTEL · IIT Kharagpur</span>
      <h1>Your Results</h1>
    </header>

    <div class="result-hero">
      <div class="circle-wrap">
        <svg class="circle-svg" width="180" height="180" viewBox="0 0 180 180">
          <circle class="circle-bg" cx="90" cy="90" r="80"/>
          <circle class="circle-fill" id="circle-fill" cx="90" cy="90" r="80"/>
        </svg>
        <div class="circle-label">
          <span class="pct-num" id="pct-num">0</span>
          <span class="pct-sym">%</span>
        </div>
      </div>
      <div class="result-title" id="result-title">—</div>
      <div class="result-sub" id="result-sub"></div>

      <div class="stats-row">
        <div class="stat-chip">
          <div class="stat-val" id="stat-correct" style="color:var(--green)">0</div>
          <div class="stat-label">Correct</div>
        </div>
        <div class="stat-chip">
          <div class="stat-val" id="stat-wrong" style="color:var(--red)">0</div>
          <div class="stat-label">Wrong</div>
        </div>
        <div class="stat-chip">
          <div class="stat-val" id="stat-skip" style="color:var(--yellow)">0</div>
          <div class="stat-label">Skipped</div>
        </div>
        <div class="stat-chip">
          <div class="stat-val" id="stat-total" style="color:var(--muted)">0</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
    </div>

    <div id="wrong-section" style="display:none">
      <p class="section-title">Review — Incorrect &amp; Skipped</p>
      <div id="review-container"></div>
    </div>

    <div style="display:flex;justify-content:center">
      <button class="btn-retry" onclick="retryQuiz()">↩ Retry Quiz</button>
    </div>
  </div>

</div>

<script>
const allQuestions = [
/* ── WEEK 1 ── */
{question:"Why are IP rights granted for a limited duration instead of permanently?",type:"mcq",options:["To increase the cost of creation","To balance creator rewards with public access","To allow creators to monopolize markets forever","Because creations lose value after one year"],answer:[1]},
{question:"Intellectual Property can best be described as:",type:"mcq",options:["Physical objects owned by an inventor","Public goods available for free use","Creations of the mind granted exclusive rights for a limited time","Government-owned information"],answer:[2]},
{question:"Which of the following is NOT typically part of the bundle of rights under property ownership?",type:"mcq",options:["Right to use","Right to license","Right to exclude","Right to terminate legislation"],answer:[3]},
{question:"Choose the correct statements: A. Trade secrets are suitable when an invention can be easily reverse-engineered. B. Copyright protects creative expression, but not the underlying ideas.",type:"mcq",options:["Only A is true","Only B is true","Both A and B are true","Both A and B are false"],answer:[1]},
{question:"Assertion: Fashion designers receive legal protection for their unique dress designs. Reason: Utility Theory justifies protection because designs may have societal or commercial utility.",type:"mcq",options:["Both A and R are true, and R is the correct explanation","Both A and R are true, but R is NOT the correct explanation","A is true, R is false","A is false, R is true"],answer:[1]},
{question:"Assertion: Personality Theory is mostly applicable to copyright and industrial design. Reason: These creations reflect the personality of the creator and moral rights are involved.",type:"mcq",options:["Both A and R are true, and R is the correct explanation","Both A and R are true, but R is NOT the correct explanation","A is true, R is false","A is false, R is true"],answer:[0]},
{question:"The creation of a new plant variety and granting rights to the breeder is an example of:",type:"mcq",options:["Trade Secret","Industrial Design","Patent","Plant Variety Rights"],answer:[3]},
{question:"Assertion: Geographical Indications reward communities for unique products linked to a region. Reason: GIs are granted based on functional innovations within a product.",type:"mcq",options:["Both A and R are true, and R is the correct explanation","Both A and R are true, but R is NOT the correct explanation","A is true, R is false","A is false, R is true"],answer:[2]},
{question:"Match IP form with typical duration in India — Patent / Industrial Design / Copyright / GI:",type:"mcq",options:["Patent=20yr, ID=10yr, Copyright=Life+60, GI=10yr (renewable)","Patent=10yr, ID=20yr, Copyright=Life+60, GI=Life","Patent=15yr, ID=10yr, Copyright=Life+70, GI=10yr","Patent=20yr, ID=15yr, Copyright=Life+50, GI=20yr"],answer:[0]},
{question:"Match IP to scenario — Trademark / Patent / Industrial Design / Copyright with Logo on packaging / Functional engine improvement / Shape of perfume bottle / Software UI layout:",type:"mcq",options:["Trademark=Logo, Patent=Engine, ID=Bottle, Copyright=Software UI","Trademark=Software UI, Patent=Logo, ID=Engine, Copyright=Bottle","Trademark=Engine, Patent=Software UI, ID=Logo, Copyright=Bottle","Trademark=Bottle, Patent=Engine, ID=Logo, Copyright=Software UI"],answer:[0]},
{question:"Select all TRUE statements about IP rights and information goods:",type:"msq",options:["Without IP rights, creators may still receive full economic benefits naturally","The ease of duplication of information goods is a key reason IP protection is necessary","Granting perpetual ownership ensures both creators and society continuously benefit","IPR aim to convert public-good creations into excludable assets for a limited time","If a creator keeps full exclusivity and does not disclose, society may receive limited benefit"],answer:[1,3,4]},
{question:"For an engineer or technologist, understanding IPR is essential because it enables:",type:"msq",options:["Evaluation of patent landscapes for product development","Avoidance of infringement risks","Protection of ideas indefinitely without renewal","Strategic collaboration and technology licensing"],answer:[0,1,3]},
{question:"Which statements are true about Labour Theory?",type:"msq",options:["Rewards creators for intellectual work","Only applies to physical labor","Basis for justifying exclusive rights","Proposed by John Locke"],answer:[0,2,3]},
{question:"Which elements of mobile technology could be considered trade secrets?",type:"msq",options:["Proprietary polymer formula for durability","Publicly advertised camera specifications","Source code of proprietary software not disclosed publicly","Logo of the mobile company"],answer:[0,2]},
{question:"Which two IP rights primarily protect touchscreen software and a secret screen coating formula?",type:"msq",options:["Copyright","Trademark","Trade Secret","Industrial Design"],answer:[0,2]},
/* ── WEEK 2 ── */
{question:"Which of the following best describes the negative right associated with patents?",type:"mcq",options:["The right to exploit the invention commercially","The right to prevent others from using the invention without permission","The right to keep the invention secret","The right to obtain patents in multiple countries automatically"],answer:[1]},
{question:"A startup combines two known alloys for slightly improved corrosion resistance using a technique any materials engineer would typically apply. Most appropriate assessment?",type:"mcq",options:["Patentable because any improvement qualifies as novelty","Not patentable because it lacks an inventive step","Patentable because it has industrial applicability","Patentable because combining known materials always creates patentable innovation"],answer:[1]},
{question:"Which would qualify as an 'invention' rather than a 'discovery'?",type:"mcq",options:["Finding a new mineral in a forest","Identifying a naturally occurring gene sequence","Developing a synthetic variant of a natural compound with improved properties","Mapping the location of an oil field"],answer:[2]},
{question:"Which BEST represents 'prior claiming'?",type:"mcq",options:["Someone has described a similar invention in a journal","Someone has filed a patent earlier that claims the same invention","Someone publicly demonstrated a similar invention at an event","Someone used the invention in a confidential lab experiment"],answer:[1]},
{question:"Assertion: A new crystalline form of a known drug cannot be patented if its therapeutic efficacy is the same. Reason: Mere discovery of a new form without enhancement of efficacy is not patentable.",type:"mcq",options:["Both A and R are true, and R is the correct explanation","Both A and R are true, but R is NOT the correct explanation","A is true, R is false","A is false, R is true"],answer:[0]},
{question:"Which invention is excluded due to being contrary to natural laws?",type:"mcq",options:["Device to increase engine efficiency using new lubricant","System to make water flow from low to high altitude without pumps","Software embedded in hardware for process control","New alloy for aerospace applications"],answer:[1]},
{question:"Assertion: Prior art search is necessary before investing in R&D. Reason: Companies use prior art search to avoid duplicating existing inventions.",type:"mcq",options:["Both A and R are true, and R is the correct explanation","Both A and R are true, but R is NOT the correct explanation","A is true, R is false","A is false, R is true"],answer:[0]},
{question:"GreenTech finds a 3-year-old research paper describing a material with similar properties in a different application. Which statement is correct?",type:"mcq",options:["The research paper cannot affect patentability because it is not a patent","The research paper can be considered prior art and may affect novelty or inventive step","Only patents filed in the last 12 months are relevant","Non-patent literature cannot be used unless cited in another patent"],answer:[1]},
{question:"Within how many months must a complete specification be filed after filing a provisional application?",type:"mcq",options:["6 months","12 months","18 months","24 months"],answer:[1]},
{question:"Which statement is true regarding a provisional and complete specification?",type:"mcq",options:["Complete specification can be outside the scope of provisional specification","Provisional specification establishes priority date","Filing multiple provisional specifications is not allowed","Provisional specification grants full patent rights"],answer:[1]},
{question:"A university lab uses a patented microchip architecture for non-commercial government-funded research. Which statements are true regarding infringement?",type:"msq",options:["Non-commercial academic use is usually exempt","Publishing results does not remove the patent owner's rights","Using the patented architecture commercially would be infringement","Research exemption rules vary by jurisdiction"],answer:[0,1,2,3]},

/* ── Config ── */
const SECTION_SIZE = 15;
const NUM_SECTIONS = 8;

/* ── State ── */
let sections = [];      // array of 8 arrays of 15 questions each
let currentSection = 0;
let userAnswers = {};   // keyed by global question index
let sectionsDone = [];  // booleans

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initQuiz() {
  // Shuffle ALL questions, then split into 8 sections of 15
  const shuffled = shuffle(allQuestions);
  sections = [];
  for (let s = 0; s < NUM_SECTIONS; s++) {
    sections.push(shuffled.slice(s * SECTION_SIZE, (s + 1) * SECTION_SIZE));
  }
  currentSection = 0;
  userAnswers = {};
  sectionsDone = new Array(8).fill(false);

  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('top-bar').style.display = 'flex';
  document.getElementById('warn-bar').style.display = 'none';

  renderSection();
}

function globalIdx(localIdx) {
  return currentSection * SECTION_SIZE + localIdx;
}

function renderSection() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  const letters = ['A','B','C','D','E'];
  const qs = sections[currentSection];

  // Section header
  const hdr = document.createElement('div');
  hdr.className = 'section-header';
  hdr.innerHTML = `
    <span class="section-badge">Section ${currentSection + 1}</span>
    <span class="section-label">${getSectionName(currentSection)}</span>
    <span class="section-count">${SECTION_SIZE} Questions</span>
  `;
  container.appendChild(hdr);

  // Questions
  qs.forEach((q, li) => {
    const gi = globalIdx(li);
    const card = document.createElement('div');
    card.className = 'q-card';
    card.style.animationDelay = `${Math.min(li * 0.025, 0.5)}s`;

    card.innerHTML = `
      <div class="q-meta">
        <span class="q-num">Q${li + 1}</span>
        <span class="q-badge badge-${q.type}">${q.type.toUpperCase()}</span>
      </div>
      <div class="q-text">${q.question}</div>
      <div class="options" id="opts-${gi}">
        ${q.options.map((opt, oi) => `
          <div class="option" id="opt-${gi}-${oi}" onclick="toggleOption(${gi},${oi})">
            <div class="opt-bullet">${letters[oi]}</div>
            <div class="opt-text">${opt}</div>
          </div>
        `).join('')}
      </div>
      ${q.type === 'msq' ? '<p class="msq-hint">Select all correct answers</p>' : ''}
    `;
    container.appendChild(card);

    // Restore previous selections
    if (userAnswers[gi]) {
      userAnswers[gi].forEach(oi => {
        const el = document.getElementById(`opt-${gi}-${oi}`);
        if (el) el.classList.add('selected');
      });
    }
  });

  // Section navigation
  const nav = document.createElement('div');
  nav.className = 'section-nav';

  const dotsHtml = sections.map((_, i) => {
    let cls = 'dot';
    if (i === currentSection) cls += ' active';
    else if (sectionsDone[i]) cls += ' done';
    return `<div class="${cls}" onclick="goToSection(${i})" title="Section ${i+1}"></div>`;
  }).join('');

  const isLast = currentSection === sections.length - 1;

  nav.innerHTML = `
    <button class="btn-nav" onclick="prevSection()" ${currentSection === 0 ? 'disabled' : ''}>← Previous</button>
    <div class="section-dots">${dotsHtml}</div>
    ${isLast
      ? `<button class="btn-nav btn-nav-next" onclick="submitQuiz()">Submit Test ✓</button>`
      : `<button class="btn-nav btn-nav-next" onclick="nextSection()">Next Week →</button>`
    }
  `;
  container.appendChild(nav);

  updateProgress();
  updateTopBar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getSectionName(idx) {
  return `Section ${idx + 1} of ${NUM_SECTIONS}`;
}

function updateTopBar() {
  document.getElementById('top-bar-section').textContent =
    `Section ${currentSection + 1} / 8  ·  ${getSectionName(currentSection)}`;
}

function goToSection(idx) {
  sectionsDone[currentSection] = true;
  currentSection = idx;
  renderSection();
}

function prevSection() {
  if (currentSection > 0) {
    sectionsDone[currentSection] = true;
    currentSection--;
    renderSection();
  }
}

function nextSection() {
  if (currentSection < sections.length - 1) {
    sectionsDone[currentSection] = true;
    currentSection++;
    renderSection();
  }
}

function toggleOption(gi, oIdx) {
  const si = Math.floor(gi / SECTION_SIZE);
  const li = gi % SECTION_SIZE;
  const q = sections[si][li];
  if (!userAnswers[gi]) userAnswers[gi] = new Set();

  if (q.type === 'mcq') {
    userAnswers[gi].clear();
    userAnswers[gi].add(oIdx);
    for (let i = 0; i < q.options.length; i++) {
      document.getElementById(`opt-${gi}-${i}`).classList.remove('selected');
    }
    document.getElementById(`opt-${gi}-${oIdx}`).classList.add('selected');
  } else {
    if (userAnswers[gi].has(oIdx)) {
      userAnswers[gi].delete(oIdx);
      document.getElementById(`opt-${gi}-${oIdx}`).classList.remove('selected');
    } else {
      userAnswers[gi].add(oIdx);
      document.getElementById(`opt-${gi}-${oIdx}`).classList.add('selected');
    }
  }
  updateProgress();
}

function updateProgress() {
  const total = sections.length * SECTION_SIZE;
  const answered = Object.values(userAnswers).filter(s => s.size > 0).length;
  const pct = total ? (answered / total) * 100 : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${answered} / ${total} answered`;
}

function submitQuiz() {
  const total = sections.length * SECTION_SIZE;
  const unanswered = total - Object.values(userAnswers).filter(s => s.size > 0).length;
  const warnBar = document.getElementById('warn-bar');

  if (unanswered > 0) {
    warnBar.style.display = 'block';
    warnBar.textContent = `⚠ ${unanswered} question${unanswered > 1 ? 's are' : ' is'} unanswered. You may submit anyway or go back to answer them.`;
  }

  showResults();
}

function isCorrect(gi) {
  const si = Math.floor(gi / SECTION_SIZE);
  const li = gi % SECTION_SIZE;
  const q = sections[si][li];
  const chosen = userAnswers[gi] ? [...userAnswers[gi]].sort((a, b) => a - b) : [];
  const correct = [...q.answer].sort((a, b) => a - b);
  return JSON.stringify(chosen) === JSON.stringify(correct);
}

function showResults() {
  const total = sections.length * SECTION_SIZE;
  let correct = 0, wrong = 0, skipped = 0;

  for (let gi = 0; gi < total; gi++) {
    const ans = userAnswers[gi];
    if (!ans || ans.size === 0) skipped++;
    else if (isCorrect(gi)) correct++;
    else wrong++;
  }

  const pct = Math.round((correct / total) * 100);

  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('top-bar').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-skip').textContent = skipped;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('pct-num').textContent = pct;

  const circumference = 502;
  const offset = circumference - (pct / 100) * circumference;
  const fill = document.getElementById('circle-fill');
  const color = pct >= 75 ? '#3ecf8e' : pct >= 50 ? '#f7c948' : '#f75f5f';
  fill.style.stroke = color;
  document.getElementById('pct-num').style.color = color;
  setTimeout(() => { fill.style.strokeDashoffset = offset; }, 100);

  const titles = [
    [90, 'Outstanding! 🏆', 'You have an exceptional grasp of IP law.'],
    [75, 'Great Work! 🎉', 'Strong understanding across most topics.'],
    [50, 'Good Effort 👍', 'A bit more revision and you\'ll nail it.'],
    [0,  'Keep Practising 📚', 'Review the lectures and try again!']
  ];
  for (const [threshold, title, sub] of titles) {
    if (pct >= threshold) {
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-sub').textContent = `${correct} correct out of ${total} questions — ${sub}`;
      break;
    }
  }

  const wrongSection = document.getElementById('wrong-section');
  const reviewContainer = document.getElementById('review-container');
  reviewContainer.innerHTML = '';

  const letters = ['A','B','C','D','E'];
  const wrongOnes = [];
  for (let gi = 0; gi < total; gi++) {
    if (!isCorrect(gi)) {
      const si = Math.floor(gi / SECTION_SIZE);
      const li = gi % SECTION_SIZE;
      wrongOnes.push({ q: sections[si][li], gi });
    }
  }

  if (wrongOnes.length === 0) {
    wrongSection.style.display = 'none';
  } else {
    wrongSection.style.display = 'block';
    wrongOnes.forEach(({ q, gi }, ri) => {
      const chosen = userAnswers[gi] ? new Set(userAnswers[gi]) : new Set();
      const correct_set = new Set(q.answer);
      const card = document.createElement('div');
      card.className = 'review-card';

      const optsHtml = q.options.map((opt, oi) => {
        let cls = '';
        if (correct_set.has(oi)) cls = 'correct';
        else if (chosen.has(oi)) cls = 'wrong';
        return `<div class="option ${cls}" style="cursor:default">
          <div class="opt-bullet">${letters[oi]}</div>
          <div class="opt-text">${opt}</div>
        </div>`;
      }).join('');

      const wk = Math.floor(gi / SECTION_SIZE) + 1;
      const skippedLabel = (!userAnswers[gi] || userAnswers[gi].size === 0)
        ? '<span style="font-size:12px;color:var(--yellow);margin-left:8px;">SKIPPED</span>' : '';

      card.innerHTML = `
        <div class="q-meta">
          <span class="q-num" style="color:var(--red)">Wrong #${ri + 1}</span>
          <span class="q-badge badge-${q.type}">${q.type.toUpperCase()}</span>
          ${skippedLabel}
        </div>
        <div class="review-q">${q.question}</div>
        <div class="review-opts">${optsHtml}</div>
      `;
      reviewContainer.appendChild(card);
    });
  }
}

function retryQuiz() {
  document.getElementById('top-bar').style.display = 'flex';
  initQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Easter egg: long-press submit ── */
let holdTimer = null;

function startHold() {
  holdTimer = setTimeout(() => {
    const toast = document.getElementById('nahi-toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }, 5000);
}

function cancelHold() {
  clearTimeout(holdTimer);
  holdTimer = null;
}

initQuiz();
</script>
